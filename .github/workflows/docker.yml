name: API container

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t food-classifier-api:local .
      - name: Exercise real container with synthetic weights
        run: python docker/smoke_test.py --image food-classifier-api:local
