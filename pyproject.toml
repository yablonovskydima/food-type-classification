[project]
name = "foodclassifier"
version = "0.1.0"
description = "Food-11 image classification with ResNet-18 trained from scratch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tensorboard",
    "tqdm",
    "kaggle",
    "six",  # kaggle 2.x imports it but does not declare it as a dependency
    "python-dotenv",
]

[project.optional-dependencies]
app = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "streamlit>=1.67.0",
    "onnx",
    "onnxruntime",
    "onnxscript>=0.7.2",
]
dev = ["pytest", "ruff", "pre-commit", "jupyter"]

# On Windows install the CUDA build of PyTorch (the PyPI wheel is CPU-only there).
# It needs an NVIDIA driver with CUDA 13.2+ and still runs on machines without a GPU.
# Linux (CI) and macOS keep the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
