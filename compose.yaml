# Both services mount one trained checkpoint read-only as /models/best.pt.
# Input size and normalisation are read from the checkpoint itself.
x-model: &model
  volumes:
    - type: bind
      source: ${MODEL_CHECKPOINT:?Set MODEL_CHECKPOINT to a trained best.pt}
      target: /models/best.pt
      read_only: true
      bind:
        create_host_path: false
  init: true
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *model
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  demo:
    <<: *model
    build:
      context: .
      target: demo
    ports:
      - "127.0.0.1:${DEMO_PORT:-8501}:8501"
    environment:
      CHECKPOINT_DIR: /models
